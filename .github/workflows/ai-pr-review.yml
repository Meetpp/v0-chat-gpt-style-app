name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  ai_review:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       (github.event.action != 'closed' || github.event.pull_request.merged == true))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Code Review
        uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  type_check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: ai_review

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript type check
        run: npm run type-check
        # OR if not defined:
        # run: npx tsc --noEmit

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: type_check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
